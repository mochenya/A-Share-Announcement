[project]
name = "a-share-announcement"
version = "0.2.0"
description = "Shared CNInfo, SSE, and SZSE announcement clients."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "mochenya", email = "mochenya@users.noreply.github.com" },
]
keywords = [
    "a-share",
    "announcement",
    "cninfo",
    "sse",
    "szse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "truststore>=0.10.4",
]

[project.urls]
Homepage = "https://github.com/mochenya/A-Share-Announcement"
Repository = "https://github.com/mochenya/A-Share-Announcement.git"
Issues = "https://github.com/mochenya/A-Share-Announcement/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/announcement_common",
    "src/cninfo_announcement",
    "src/sse_announcement",
    "src/szse_announcement",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
